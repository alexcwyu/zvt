[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "zvt"
version = "0.13.4"
description = "Unified, modular quant framework for human beings"
readme = "README.md"
requires-python = ">=3.13,<3.16"
license = {text = "MIT"}
authors = [
    {name = "foolcage", email = "5533061@qq.com"},
]
keywords = ["quant", "stock", "finance", "fintech", "big-data", "zvt", "technical-analysis", "trading-platform", "pandas", "fundamental-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Customer Service",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.34.2",
    "SQLAlchemy>=2.1.4",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "arrow>=1.4.0",
    "openpyxl>=3.1.5",
    "demjson3>=3.0.6",
    "plotly>=7.1.0",
    "dash>=4.4.1",
    "jqdatapy>=0.1.8",
    "dash-bootstrap-components>=2.0.4",
    "dash-daq>=0.6.0",
    "scikit-learn>=1.9.1",
    "fastapi>=0.143.0",
    "fastapi-pagination>=0.16.1",
    "apscheduler>=3.11.3",
    "eastmoneypy>=0.2.0",
    "orjson>=3.13.0",
    "numpy>=2.5.4",
    "pytz>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "pyright>=1.1.414",
    "ipython>=9.17.1",
    "nbformat>=5.11.1",
]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Homepage = "https://github.com/zvtvz/zvt"
Repository = "https://github.com/zvtvz/zvt"
"Bug Reports" = "https://github.com/zvtvz/zvt/issues"
Funding = "https://www.foolcage.com/zvt"
Source = "https://github.com/zvtvz/zvt"

[project.scripts]
zvt = "zvt.main:main"
zvt_server = "zvt.zvt_server:main"
zvt_export = "zvt.plugin:export"

[tool.hatch.build.targets.wheel]
packages = ["src/zvt"]

[tool.hatch.build.targets.sdist]
include = [
    "src/zvt/**",
    "README.md",
    "README-cn.md",
    "LICENSE",
    "requirements.txt",
]
exclude = [
    "tests/**",
    "docs/**",
    "examples/**",
    "api-tests/**",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["zvt"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]
